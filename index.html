<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Fun Facts</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1> AI Fun Facts</h1>

        <p>Enter a topic and discover an interesting fact!</p>

        <input
            type="text"
            id="topic"
            placeholder="Enter a topic..."
        >

        <button id="factButton">
            Get Fun Fact
        </button>

        <div id="result">
            Your fun fact will appear here.
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
